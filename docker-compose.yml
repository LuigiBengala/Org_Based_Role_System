services:
  api:
    image: org_based_role_system
    ports:
      - 8001:8000
    depends_on:
      - postgres
    command: sh -c "sleep 5 && alembic upgrade head && fastapi run/main.py --pot 8000"

  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=123
      - POSTGRES_DB=occam
    volumes:
      - occam-data:/var/lib/postgresql/data
    
volumes:
  occam-data: